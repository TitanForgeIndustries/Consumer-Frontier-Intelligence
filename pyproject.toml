[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "consumer-frontier-intelligence"
version = "0.1.0"
description = "Open research into frontier-class AI capability under consumer hardware constraints."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Bryce Courtney" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
excel = ["openpyxl>=3.1"]
system = ["psutil>=5.9"]
all = ["openpyxl>=3.1", "psutil>=5.9"]

[project.scripts]
cfi-experiment = "cfi_experiment_logger.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
